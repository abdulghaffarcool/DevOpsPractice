name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/devopspractice
      IMAGE_TAG: ${{ github.sha }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Uncomment later when tests exist
      # - name: Test
      #   run: dotnet test --no-build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f DevOpsPractice.Web/Dockerfile \
            -t $IMAGE_NAME:$IMAGE_TAG \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest
      
      # - name: Update Kubernetes Manifest
      #   run: |
      #     sed -i "s|image: abdulghaffar2455/devopspractice:.*|image: abdulghaffar2455/devopspractice:${{ github.sha }}|" k8s/app-deployment.yaml
      
      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: abdulghaffar2455/devopspractice:.*|image: abdulghaffar2455/devopspractice:${{ github.sha }}|" k8s/base/app-deployment.yaml

          echo "Updated manifest:"
          grep "image:" k8s/base/app-deployment.yaml

      # - name: Commit and Push Manifest
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      #     git add k8s/app-deployment.yaml

      #     git commit -m "Update application image to ${{ github.sha }} [skip ci]"

      #     git push

      - name: Commit and Push Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/base/app-deployment.yaml

          git diff --cached --quiet || git commit -m "Update application image to ${{ github.sha }} [skip ci]"

          git push