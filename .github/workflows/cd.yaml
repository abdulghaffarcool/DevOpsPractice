name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restart Kubernetes Deployment
        run: kubectl rollout restart deployment/devopspractice-web -n devopspractice

      - name: Wait for Rollout
        run: kubectl rollout status deployment/devopspractice-web -n devopspractice