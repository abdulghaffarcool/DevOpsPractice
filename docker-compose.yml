version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devopspractice-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  web:
    build:
      context: .
      dockerfile: DevOpsPractice.Web/Dockerfile

    container_name: devopspractice-web

    depends_on:
      - sqlserver

    ports:
      - "8080:8080"

    environment:

      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=DevOpsPracticeDb;
        User Id=sa;
        Password=YourStrong@Passw0rd;
        TrustServerCertificate=True;

volumes:
  sql_data: