apiVersion: autoscaling/v2
kind: HorizontalPodAutoscalar
metadata:
  name: devopspractice-web-hpa
  namespace: devopspractice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devopspractice-web

  minReplicas: 1
  maxReplicas: 3

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70